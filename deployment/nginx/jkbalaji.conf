# =====================================================================
# /etc/nginx/sites-available/jkbalaji.conf  (symlink into sites-enabled)
# JK Balaji - Next.js (127.0.0.1:3000) + NestJS API (127.0.0.1:4000)
# Replace example.com with the real domain. SSL via Certbot (Let's Encrypt):
#   sudo certbot --nginx -d example.com -d www.example.com
# Until certificates exist, comment out the 443 server and the 80->443 redirect,
# and use the temporary HTTP block at the bottom.
# =====================================================================

upstream jkbalaji_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream jkbalaji_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# Rate-limit zones (auth endpoints stricter than general API)
limit_req_zone $binary_remote_addr zone=jkb_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=jkb_auth:10m rate=10r/m;

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    # Ubuntu 24.04 ships Nginx 1.24 -> use `listen ... http2`. On Nginx >= 1.25.1 switch to `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # --- SSL (paths created by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # include /etc/letsencrypt/options-ssl-nginx.conf;   # alternative: certbot-managed options
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP: start in report-only, tighten once the UI is built
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    server_tokens off;

    # --- Limits ---
    client_max_body_size 12m;        # receipts/bills/agreements upload (API UPLOAD_MAX_MB=10)
    client_body_timeout 30s;
    keepalive_timeout 65s;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml font/woff2;

    access_log /var/log/nginx/jkbalaji.access.log;
    error_log  /var/log/nginx/jkbalaji.error.log warn;

    # --- Common proxy settings ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    # --- API: /api/* -> NestJS (prefix kept: Nest serves /api/v1/...) ---
    # Brute-force protection only on credential endpoints (NOT /auth/me or /auth/refresh)
    location ~ ^/api/v1/auth/(login|forgot-password|reset-password)$ {
        limit_req zone=jkb_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://jkbalaji_api;
    }

    location ^~ /api/ {
        limit_req zone=jkb_api burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;     # long-running report exports
        proxy_pass http://jkbalaji_api;
    }

    # --- Next.js immutable build assets (long cache) ---
    # NOTE: an add_header inside a location replaces server-level add_header directives (Nginx inheritance);
    # acceptable for static assets. Add `include snippets/jkbalaji-security-headers.conf;` if you want them repeated.
    location ^~ /_next/static/ {
        proxy_pass http://jkbalaji_web;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /assets/ {
        proxy_pass http://jkbalaji_web;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # --- Everything else -> Next.js ---
    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://jkbalaji_web;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}

