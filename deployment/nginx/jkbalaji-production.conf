upstream jkbalaji_web {
    server 127.0.0.1:3000;
}

upstream jkbalaji_api {
    server 127.0.0.1:4000;
}

# ---------- jkbalaji.in + www ----------
server {
    listen 80;
    listen [::]:80;
    server_name jkbalaji.in www.jkbalaji.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://jkbalaji.in$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jkbalaji.in;
    ssl_certificate /etc/letsencrypt/live/jkbalaji.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkbalaji.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://jkbalaji.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jkbalaji.in;

    ssl_certificate /etc/letsencrypt/live/jkbalaji.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkbalaji.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /root/jkbalaji/logs/nginx_jkbalaji_access.log;
    error_log /root/jkbalaji/logs/nginx_jkbalaji_error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://jkbalaji_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://jkbalaji_web;
    }
}

